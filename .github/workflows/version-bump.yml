name: Version Bump

# The local .husky/pre-push hook only fires on a direct `git push` to main —
# GitHub's "Merge pull request" button doesn't run local git hooks, so
# merges via the UI never bumped the version. This workflow is the
# server-side equivalent: it runs on every push to main and bumps the
# patch version, unless the push already changed it (i.e. someone ran
# `bun run version:minor`/`version:major` — or the hook already bumped it —
# before merging), in which case it does nothing.

on:
  push:
    branches: [main]

permissions:
  contents: write

concurrency:
  group: version-bump-main
  cancel-in-progress: false

jobs:
  bump:
    # Guards against the bump commit's own push re-triggering this workflow.
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          ref: main
          fetch-depth: 0

      - name: Check whether this push already changed the version
        id: check
        run: |
          BEFORE_VERSION=$(git show "${{ github.event.before }}:frontend/package.json" | node -e "process.stdout.write(JSON.parse(require('fs').readFileSync(0,'utf8')).version)")
          CURRENT_VERSION=$(node -e "process.stdout.write(require('./frontend/package.json').version)")
          if [ "$BEFORE_VERSION" != "$CURRENT_VERSION" ]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Bump patch version
        if: steps.check.outputs.skip == 'false'
        run: |
          NEW_VERSION=$(node -e "
            const fs = require('fs');
            const pkg = JSON.parse(fs.readFileSync('frontend/package.json', 'utf8'));
            const [major, minor, patch] = pkg.version.split('.').map(Number);
            pkg.version = \`\${major}.\${minor}.\${patch + 1}\`;
            fs.writeFileSync('frontend/package.json', JSON.stringify(pkg, null, 2) + '\n');
            process.stdout.write(pkg.version);
          ")
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add frontend/package.json
          git commit -m "chore: bump version to $NEW_VERSION"
          git push origin HEAD:main
